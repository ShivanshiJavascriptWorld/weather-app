<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width , initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="conatiner">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button class="searchBtn"><img src="./images/searchicon.png" width="50px" height="50px"></button>
        </div>
        <div class="weather">
            <img src="./images/weathee rain.jpeg" alt="weatherIcon" class="weatherIcon">
            <h1 class="temp">22°C</h1>
            <h3 class="city">Kanpur</h3>
            <div class="details">
                <div class="col">
                    <img src="./images/humidity.jpg">
                    <div class="colDetails">
                    <p class="humidity">50%</p>
                    <p>humidity</p>
                </div>
                </div>
                <div class="col">
                    <img src="./images/pngtree-vector-wind-icon-png-image_4225203.jpg">
                    <div class="colDetails">
                    <p class="wind">50km/hr</p>
                    <p>Wind</p>
                    </div>  
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" ></script>
    </body>
    </html>
